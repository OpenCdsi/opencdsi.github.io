
  <!-- FOOTER -->
  <footer class="footer footer-custom py-6">
    <div class="container">
      <div class="columns">
        <div class="column is-6">
          <p class="title is-4 has-text-white"><a href="/">{{ site.title }}</a></p>
          <p class="subtitle is-6 has-text-grey-light">
            {{ site.tagline }}
          </p>
        </div>
        <div class="column is-6 has-text-right-tablet">
          <p>&copy; 2026 {{ site.author | site.email }} All rights reserved.</p>
          <p class="is-size-7 mt-2">Released under the Mozilla Public License 2.0</p>
        </div>
      </div>
    </div>
  </footer>

  <!-- Navbar Toggle Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const $navbarBurgers = Array.prototype.slice.call(document.querySelectorAll('.navbar-burger'), 0);
      $navbarBurgers.forEach( el => {
        el.addEventListener('click', () => {
          const target = el.dataset.target;
          const $target = document.getElementById(target);
          el.classList.toggle('is-active');
          $target.classList.toggle('is-active');
        });
      });
    });
  </script>
