
<div class="media-content">
	<div class="content">
		<p style="margin-bottom: 0.5rem;">
			<strong><a href="{{ post.url }}">{{ post.title }}</a></strong>
			<small class="has-text-grey">{{ post.date | date: "%B %d, %Y" }}</small>
			<br>
			{{ post.excerpt | strip_html | truncatewords: 50 }}
		</p>
	</div>
</div>
